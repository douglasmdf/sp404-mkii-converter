<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SP-404 MKII Converter</title>
  </head>
  <body data-stage="empty">
    <header id="band">
      <h1 class="visually-hidden" data-i18n="appTitle"></h1>
      <ol id="steps">
        <li data-step="add"><span class="pict"><span data-icon="add"></span></span><span data-i18n="stepAdd"></span></li>
        <li data-step="review"><span class="pict"><span data-icon="review"></span></span><span data-i18n="stepReview"></span></li>
        <li data-step="convert"><span class="pict"><span data-icon="convert"></span></span><span data-i18n="stepConvert"></span></li>
        <li data-step="card"><span class="pict"><span data-icon="card"></span></span><span data-i18n="stepCard"></span></li>
      </ol>
      <div id="gate" aria-live="polite">
        <span id="gate-number" class="flap">0</span>
        <span id="gate-label"></span>
      </div>
      <button id="settings-btn" class="pict-btn" data-i18n-title="settings" data-i18n-aria="settings"><span data-icon="settings"></span></button>
      <div id="progress" hidden><div id="progress-fill"></div></div>
    </header>

    <aside id="rail">
      <h2 data-i18n="entriesTitle"></h2>
      <p id="rail-empty" data-i18n="noEntries"></p>
      <ul id="pack-list"></ul>
      <div id="rail-actions">
        <button id="add-folders-btn"><span data-icon="add"></span><span data-i18n="addFolders"></span></button>
        <button id="add-files-btn"><span data-icon="addFile"></span><span data-i18n="addFiles"></span></button>
      </div>
    </aside>

    <main id="work">
      <section id="message" hidden></section>

      <section id="arrival" class="lockup">
        <span class="pict pict-xl"><span data-icon="arrowDown"></span></span>
        <div>
          <p class="lockup-title" data-i18n="dropHint"></p>
          <p class="lockup-sub" data-i18n="tagline"></p>
        </div>
      </section>

      <section id="route" hidden>
        <div class="route-row">
          <span class="pict"><span data-icon="review"></span></span>
          <div><strong data-i18n="dryRun"></strong><p data-i18n="routeDryRun"></p></div>
        </div>
        <div class="route-row">
          <span class="pict"><span data-icon="convert"></span></span>
          <div><strong data-i18n="convertAll"></strong><p id="route-dest"></p></div>
        </div>
        <div class="route-row">
          <span class="pict"><span data-icon="ear"></span></span>
          <div><strong data-i18n="routeNamesTitle"></strong><p id="route-keybpm"></p></div>
          <button id="route-settings-btn" class="link" data-i18n="change"></button>
        </div>
      </section>

      <section id="busy-sign" class="lockup" hidden>
        <span class="pict pict-xl spin"><span data-icon="convert"></span></span>
        <div>
          <p id="busy-label" class="lockup-title"></p>
          <p id="busy-sub" class="lockup-sub"></p>
        </div>
      </section>

      <section id="results" hidden>
        <div id="results-head">
          <h2 id="results-title"></h2>
          <div id="results-counts" class="counters"></div>
        </div>
        <div id="tabs" role="tablist"></div>
        <div id="table-wrap">
          <table id="result-table">
            <thead>
              <tr>
                <th class="col-state"><span class="visually-hidden" data-i18n="colState"></span></th>
                <th data-i18n="colSource"></th>
                <th data-i18n="colTarget"></th>
                <th data-i18n="colNote"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="table-empty" hidden data-i18n="tableEmpty"></p>
        </div>
      </section>

      <div id="drop-veil" aria-hidden="true">
        <span class="pict pict-xl"><span data-icon="arrowDown"></span></span>
        <p data-i18n="dropRelease"></p>
      </div>
    </main>

    <footer id="actions">
      <button id="clear-btn"><span data-icon="clear"></span><span data-i18n="clear"></span></button>
      <button id="undo-btn"><span data-icon="undo"></span><span data-i18n="undo"></span></button>
      <span id="footer-hint"></span>
      <button id="dry-run-btn"><span data-icon="review"></span><span data-i18n="dryRun"></span></button>
      <button id="convert-btn" class="primary"><span class="pict"><span data-icon="arrowRight"></span></span><span data-i18n="convertAll"></span></button>
      <button id="cancel-btn" hidden><span data-icon="x"></span><span data-i18n="cancel"></span></button>
    </footer>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog">
        <div class="dialog-band">
          <h2 id="settings-title" data-i18n="settings"></h2>
          <button value="close" class="pict-btn" data-i18n-title="close" data-i18n-aria="close"><span data-icon="x"></span></button>
        </div>
        <div class="dialog-body">
          <fieldset>
            <legend data-i18n="sNames"></legend>
            <label class="check"><input type="checkbox" name="sanitizeFilenames" /> <span data-i18n="sSanitizeFilenames"></span></label>
            <label class="check"><input type="checkbox" name="sanitizeFolderNames" /> <span data-i18n="sSanitizeFolderNames"></span></label>
            <label class="check"><input type="checkbox" name="flattenFolders" /> <span data-i18n="sFlatten"></span></label>
            <label class="field">
              <span data-i18n="sMaxLength"></span>
              <input type="number" name="maxFilenameLength" min="1" max="255" data-i18n-placeholder="sMaxLengthHint" />
            </label>
          </fieldset>
          <fieldset>
            <legend data-i18n="sKeyBpm"></legend>
            <label class="check"><input type="checkbox" name="detectKeyBpm" /> <span data-i18n="sDetectKeyBpm"></span></label>
            <label class="field">
              <span data-i18n="sBpmRange"></span>
              <select name="bpmRange">
                <option value="58-115">58–115</option>
                <option value="68-135">68–135</option>
                <option value="78-166">78–166</option>
                <option value="88-175">88–175</option>
                <option value="98-195">98–195</option>
              </select>
            </label>
          </fieldset>
          <fieldset>
            <legend data-i18n="sConversion"></legend>
            <label class="check"><input type="checkbox" name="downmixMultichannel" /> <span data-i18n="sDownmix"></span></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="sOutput"></legend>
            <label class="field">
              <span data-i18n="sSaveMode"></span>
              <select name="saveMode">
                <option value="ask" data-i18n="sAsk"></option>
                <option value="fixed" data-i18n="sFixed"></option>
                <option value="nextToSource" data-i18n="sNextToSource"></option>
              </select>
            </label>
            <div class="field">
              <span data-i18n="sFixedDir"></span>
              <code id="fixed-dir-label"></code>
              <button type="button" id="choose-fixed-btn" data-i18n="sChoose"></button>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="sAdvanced"></legend>
            <label class="field"><span data-i18n="sWorkers"></span> <input type="number" name="workers" min="1" max="32" /></label>
            <label class="check"><input type="checkbox" name="writeJsonLog" /> <span data-i18n="sJsonLog"></span></label>
          </fieldset>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
